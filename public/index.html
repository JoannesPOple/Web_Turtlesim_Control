<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Web ROS Master</title>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .panel { background: #1e293b; padding: 25px; border-radius: 12px; width: 360px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
        .section { border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 15px; }
        .section:last-child { border-bottom: none; }
        h3 { margin-top: 0; color: #38bdf8; font-size: 16px; }
        .btn { width: 100%; padding: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin: 5px 0; font-size: 14px; color: white; }
        .btn-launch { background: #0ea5e9; }
        .btn-start { background: #10b981; }
        .btn-kill { background: #ef4444; }
        .status-banner { padding: 8px; border-radius: 6px; font-weight: bold; margin-bottom: 10px; font-size: 14px; background: #334155; color: #ef4444; }
        .grid-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .arrow-btn { background: #475569; border: none; color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .arrow-btn:active { background: #334155; }
        .log-container { background: #020617; width: 360px; border-radius: 12px; padding: 15px; border: 1px solid #1e293b; }
        .log-box { height: 120px; overflow-y: auto; background: #090d16; border: 1px solid #334155; border-radius: 6px; text-align: left; padding: 10px; font-family: monospace; font-size: 11px; color: #38bdf8; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="panel">
    <div class="section">
        <h3>1. Process Operations</h3>
        <button class="btn btn-launch" onclick="controlNode('launch', 'rosbridge')">Launch Rosbridge Server</button>
        <button class="btn btn-launch" onclick="controlNode('launch', 'turtlesim')">Run Turtlesim Node</button>
        <button class="btn btn-kill" onclick="controlNode('kill', 'all')">💥 Kill All Frameworks</button>
    </div>

    <div class="section">
        <h3>2. WebSocket Stream</h3>
        <div id="ws-status" class="status-banner">Disconnected From Core 🔴</div>
        <button class="btn btn-start" onclick="initiateRosConnection()">Initialize Web Session ⚡</button>
    </div>

    <div class="section">
        <h3>3. Robot Kinematics</h3>
        <div class="grid-pad">
            <div></div><button class="arrow-btn" onclick="sendMove(2.0, 0.0)">▲</button><div></div>
            <button class="arrow-btn" onclick="sendMove(0.0, 2.0)">◀</button>
            <button class="arrow-btn" style="background:#dc2626;" onclick="sendMove(0.0, 0.0)">🛑</button>
            <button class="arrow-btn" onclick="sendMove(0.0, -2.0)">▶</button>
            <div></div><button class="arrow-btn" onclick="sendMove(-2.0, 0.0)">▼</button><div></div>
        </div>
    </div>
</div>

<div class="log-container">
    <h3 style="margin-top:0; font-size:13px; text-align:left; color:#94a3b8;">Terminal Output Logs</h3>
    <div id="log-box" class="log-box">System idle. Ready to launch.</div>
</div>

<script>
    var rosClient = null;
    var cmdTopic = null;

    function controlNode(action, target) {
        fetch('/api/' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target: target })
        }).catch(function(err) {
            console.error(err);
            document.getElementById('log-box').textContent = "Error: Cannot talk to Backend Server!";
        });
    }

    function fetchLogs() {
        fetch('/api/logs')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var logBox = document.getElementById('log-box');
                if (data.logs && data.logs.length > 0) {
                    logBox.textContent = data.logs.join('\n');
                    logBox.scrollTop = logBox.scrollHeight;
                }
            })
            .catch(function(err) {});
    }
    setInterval(fetchLogs, 1000);

    function initiateRosConnection() {
        rosClient = new ROSLIB.Ros({ url: 'ws://localhost:9090' });
        var banner = document.getElementById('ws-status');

        rosClient.on('connection', function() {
            banner.textContent = "Connected to Robot Core 🟢";
            banner.style.color = "#10b981";
            cmdTopic = new ROSLIB.Topic({ ros: rosClient, name: '/turtle1/cmd_vel', messageType: 'geometry_msgs/msg/Twist' });
        });
        rosClient.on('error', function() {
            banner.textContent = "Connection Failure 🔴";
            banner.style.color = "#ef4444";
        });
        rosClient.on('close', function() {
            banner.textContent = "Disconnected From Core 🔴";
            banner.style.color = "#ef4444";
            cmdTopic = null;
        });
    }

    function sendMove(linear, angular) {
        if (!cmdTopic) { alert("Initialize Web Session first!"); return; }
        var msg = new ROSLIB.Message({ linear: { x: linear, y: 0, z: 0 }, angular: { x: 0, y: 0, z: angular } });
        cmdTopic.publish(msg);
    }
</script>
</body>
</html>
